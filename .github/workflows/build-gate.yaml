name: Poka-Yoke Fail-Closed Security & Quality Gate

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  security-and-lint-gate:
    name: Code Quality & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 1: Python Linter Check (DRF Code Base)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Flake8 (Formatting Check)
        run: |
          # Fail-closed on syntax errors or code-style violations
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

      # Step 2: Automated Secret & Credential Scanning (Poka-Yoke Leak Prevention)
      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog-github-action@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      # Step 3: Terraform Security & Format Validation
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ./terraform

      - name: Terraform Security Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform